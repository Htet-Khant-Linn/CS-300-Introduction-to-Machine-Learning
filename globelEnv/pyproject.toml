[project]
name = "globelenv"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Htet Khant Linn", email = "htetkhantlinn123@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
]

[project.scripts]
globelenv = "globelenv:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
